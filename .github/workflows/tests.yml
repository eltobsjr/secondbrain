name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  motor:
    # xmem.py, board.py, hook e scripts: só biblioteca padrão do Python; os testes da interface se pulam sem GTK.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testes
        run: python3 -I -m unittest discover -s tests -v
      - name: Guarda de publicação (padrões genéricos)
        # No CI não há lista de nomes de projetos (ela só existe no computador do dono); valem caminho pessoal, e-mail e chaves.
        run: python3 -I scripts/guard_publico.py --tree

  gui:
    # Roda também os testes de lógica da interface (leitor seguro, JS do grafo) com GTK4/libadwaita/WebKitGTK do sistema.
    # Passou no runner em 2026-11-18 (93 testes): agora bloqueia como o job do motor.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-webkit-6.0 nodejs
      - name: Testes (com a interface)
        run: python3 -I -m unittest discover -s tests -v
